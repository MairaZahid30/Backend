<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore • Instagram</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav class="nav-menu">

                </a>

                <a href="explore.html" class="nav-item">

                </a>

                <a href="profile.html" class="nav-item">
                    <span>◯</span>
                    <span>Profile</span>
                </a>

            </nav>

        </aside>


        <!-- Explore Content -->
        <main class="explore-content">

                <article class="explore-post">

    </div>


    <script src="../js/app.js"></script>

</html>
