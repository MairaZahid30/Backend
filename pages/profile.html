<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile • Instagram</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h1 class="logo">Instagram</h1>

            <nav class="nav-menu">

                <a href="../index.html" class="nav-item">
                    <span>⌂</span>
                    <span>Home</span>
                </a>

                <a href="explore.html" class="nav-item">
                    <span>⌕</span>
                    <span>Explore</span>
                </a>

                <a href="#" class="nav-item">
                    <span>♡</span>
                    <span>Notifications</span>
                </a>

                <a href="#" class="nav-item">
                    <span>✉</span>
                    <span>Messages</span>
                </a>

                <a href="profile.html" class="nav-item">
                    <span>◯</span>
                    <span>Profile</span>
                </a>

            </nav>

        </aside>


        <!-- Profile Content -->
        <main class="profile-content">

            <!-- Profile Header -->
            <section class="profile-header">

                <div class="profile-picture">
                    M
                </div>


                <div class="profile-info">

                    <div class="profile-top">

                        <h2>mimi</h2>

                        <button class="edit-profile">
                            Edit profile
                        </button>

                    </div>


                    <div class="profile-stats">

                        <span>
                            <strong>3</strong> posts
                        </span>

                        <span>
                            <strong>120</strong> followers
                        </span>

                        <span>
                            <strong>180</strong> following
                        </span>

                    </div>


                    <div class="profile-bio">

                        <strong>Mimi Zahid</strong>

                        <p>
                            Developer in progress 💻
                        </p>

                        <p>
                            Building something amazing ✨
                        </p>

                    </div>

                </div>

            </section>


            <!-- Profile Navigation -->
            <nav class="profile-tabs">

                <button class="active-tab">
                    POSTS
                </button>

                <button>
                    SAVED
                </button>

                <button>
                    TAGGED
                </button>

            </nav>


            <!-- User Posts -->
            <section class="profile-grid">

                <article class="profile-post">
                    <div>Post 1</div>
                </article>

                <article class="profile-post">
                    <div>Post 2</div>
                </article>

                <article class="profile-post">
                    <div>Post 3</div>
                </article>

            </section>

        </main>

    </div>


    <script src="../js/app.js"></script>

</body>
</html>
